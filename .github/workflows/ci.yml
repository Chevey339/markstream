name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve package dependencies
        run: flutter pub get --enforce-lockfile
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: Analyze package
        run: dart analyze --fatal-infos lib test
      - name: Test package
        run: flutter test --no-pub
      - name: Analyze example
        working-directory: example
        run: dart analyze --fatal-infos lib test
      - name: Test example
        working-directory: example
        run: flutter test --no-pub
      - name: Build example for web
        working-directory: example
        run: flutter build web --no-pub
